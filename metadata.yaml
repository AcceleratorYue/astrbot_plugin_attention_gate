name: astrbot_plugin_attention_gate
display_name: 注意力主动回复门控
short_desc: 用 Jev 按人格兴趣与群话题决定是否主动接话，不做随机概率
desc: >-
  观察群聊消息，用 Jev 判断当前消息是否符合全局人格兴趣、
  当前群独立话题画像，或是否产生突发接话欲望。
  只有高置信、低风险、时机合适时，才通过 AstrBot 原生管线触发一次主动回复。
  支持 dry-run、单群每小时上限、120 秒冷却、冷却期消息缓冲、
  接话延续识别、模板列表形式的兴趣/话题/问题配置和强制引用目标消息。
version: 0.2.2
author: AcceleratorYue
repo: https://github.com/AcceleratorYue/astrbot_plugin_attention_gate
social_link: https://github.com/AcceleratorYue
astrbot_version: ">=4.29,<5"
support_platforms:
  - aiocqhttp
tags:
  - 主动回复
  - Jev
  - 注意力
  - 群聊
  - TypeSafe
