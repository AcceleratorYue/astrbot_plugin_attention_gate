name: astrbot_plugin_attention_gate
display_name: 鲸鲸消息发送门控
short_desc: Jev 决定是否主动接话，统一发送窗口合并连发、控制时机、ONNX/Jev 完整性去重
desc: >-
  观察群聊与私聊消息，用 Jev 判断是否值得主动接话；决定回复后，
  所有用户面向请求进入统一发送窗口：等待用户说完、合并同用户补充、
  ONNX/Jev 判断完整、主动回复 revalidate，最终只释放一次原请求。
  支持群聊/私聊、主动回复/poke/follow-up、模板兴趣/话题、密度/疲劳和强制引用。
version: 0.8.1
author: AcceleratorYue
repo: https://github.com/AcceleratorYue/astrbot_plugin_attention_gate
social_link: https://github.com/AcceleratorYue
astrbot_version: ">=4.29,<5"
support_platforms:
  - aiocqhttp
tags:
  - 主动回复
  - 发送门控
  - 消息合并
  - 防抖
  - Jev
  - ONNX
  - 群聊
  - TypeSafe
