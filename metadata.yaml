name: astrbot_plugin_attention_gate
display_name: 消息发送门控
short_desc: Jev 决定是否主动接话，统一发送窗口合并连发、ONNX/Jev 完整性与主动回复 revalidate
desc: >-
  观察群聊与私聊消息，用 Jev 判断是否值得主动接话；决定回复后，
  普通聊天/私聊/主动回复/poke 进入统一发送窗口：等待用户说完、
  合并同用户补充、ONNX/Jev 判断完整、主动回复 revalidate，最终只释放一次原请求。
  群聊普通跟进由消息事件缓冲合并；框架已消费的 follow-up capture 不重新进入 gate。
version: 0.8.5
author: AcceleratorYue
repo: https://github.com/AcceleratorYue/astrbot_plugin_attention_gate
social_link: https://github.com/AcceleratorYue
astrbot_version: ">=4.29,<5"
support_platforms:
  - aiocqhttp
tags:
  - 主动回复
  - 发送门控
  - 消息合并
  - 防抖
  - Jev
  - ONNX
  - 群聊
  - TypeSafe
